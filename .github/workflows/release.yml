name: Release LifeOS Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'

      - name: Strip Local JVM Paths
        working-directory: ./client
        run: sed -i '/org.gradle.java/d' android/gradle.properties

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Patch Dependencies Compatibility
        working-directory: ./client
        run: python3 tool/patch_appflowy.py

      - name: Build APK
        working-directory: ./client
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Enable Developer Mode & Symlinks
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -ErrorAction SilentlyContinue
          git config --system core.symlinks true
          git config --system core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Patch Dependencies Compatibility
        shell: powershell
        working-directory: ./client
        run: python tool/patch_appflowy.py

      - name: Build Windows
        working-directory: ./client
        run: flutter build windows --release --no-pub

      - name: Zip Windows Build
        run: Compress-Archive -Path client\build\windows\x64\runner\Release\* -DestinationPath lifeos-windows-release.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-windows-zip
          path: lifeos-windows-release.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    if: always() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-artifacts

      - name: Download Windows Artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: lifeos-windows-zip
          path: release-artifacts

      - name: Generate Release Body
        run: |
          VERSION=$(jq -r '.version // "1.5.4"' .agent/version.json)
          BUILD_NUM=$(jq -r '.build_number // 42' .agent/version.json)
          cat <<EOF > release_notes.md
          ## LifeOS v$VERSION (Build #$BUILD_NUM) — Smooth TOC Navigation & Liturgical Upgrades

          ### Highlights & What's New
          - **Smooth TOC & Sidebar Navigation (Zero Indicator Flickering)**:
            - Fixed active section indicator jumping/bouncing back and forth when tapping items in the Table of Contents or desktop sidebar.
            - Added smooth cubic animations and programmatic scroll coordination to eliminate visual stutter.
          - **Full Unabbreviated Liturgical Texts (Zero Cuts / No Truncation)**:
            - **Vespers (Εσπερινός)**: Full unabbreviated 35 verses of Psalm 103 (Προοιμιακός), full 18 verses of Psalms 140/141/129/116 (Στιχολογία «Θοῦ, Κύριε...»), complete Kekragaria Stichera on 10 (3 Anastasima + 3 Anatolika + 4 Menaion Saint Prosomia), full Doxastikon of the Saint, Dogmatic Theotokion, Phos Hilaron, full Aposticha, Nunc Dimittis, complete Trisagion prayers, Apolytikia, and Apolysis.
            - **Matins (Όρθρος)**: Full unabbreviated Six Psalms (Psalms 3, 37, 62, 87, 102, 142) verse by verse, full Psalm 50, Ainoi with Saint's Prosomion, Great Doxology, Apolytikia, and Apolysis.
            - **Divine Liturgy (Θεία Λειτουργία)**: Full Chrysostom & Basil dynamic services.
          - **Commemorated Saint Selector (Επιλογέας Αγίου της Ημέρας)**:
            - Sleek dropdown menu in the top bar with a small arrow (`Icons.arrow_drop_down_rounded`) allowing seamless switching between all commemorated saints of the day.
            - Defaults to the 1st commemoration and dynamically regenerates hymns, stichera, and apolytikia for the selected saint.
          - **Offline Prayer Book & 0ms Fallbacks**:
            - Instant zero-delay loading on mobile without blocking spinners.
            - Built-in offline liturgical prayers and robust mobile daemon endpoint routing.
          - **Audiophile Studio & Offline Music Vault**:
            - 100% offline device playback, 10-band EQ, and DSP audio processing.
          - **OTA Updates & Diagnostics**:
            - Enhanced OTA update engine with one-tap background download & install.
          EOF

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: LifeOS ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release-artifacts/app-release.apk
            release-artifacts/lifeos-windows-release.zip
          fail_on_unmatched_files: false

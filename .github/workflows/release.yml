name: Release LifeOS Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'

      - name: Strip Local JVM Paths
        working-directory: ./client
        run: sed -i '/org.gradle.java/d' android/gradle.properties

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Patch Dependencies Compatibility
        run: |
          python3 -c "
          import glob, os

          for f in glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/appflowy_editor-*/lib/src/plugins/markdown/decoder/delta_markdown_decoder.dart')):
              c = open(f).read().replace('with md.NodeVisitor', 'implements md.NodeVisitor')
              open(f, 'w').write(c)

          for f in glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/appflowy_editor-*/lib/src/editor/editor_component/service/ime/delta_input_service.dart')):
              c = open(f).read()
              if 'onFocusReceived' not in c:
                  c = c.replace('class DeltaTextInputService extends TextInputService with DeltaTextInputClient {', 'class DeltaTextInputService extends TextInputService with DeltaTextInputClient {\n  @override\n  bool onFocusReceived() => false;\n')
                  open(f, 'w').write(c)
          "

      - name: Build APK
        working-directory: ./client
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Enable Developer Mode & Symlinks
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -ErrorAction SilentlyContinue
          git config --system core.symlinks true
          git config --system core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Patch Dependencies Compatibility
        shell: python
        run: |
          import glob, os

          cache_dirs = [
              os.path.expanduser('~/.pub-cache/hosted/pub.dev'),
              os.path.expandvars(r'%LOCALAPPDATA%\Pub\Cache\hosted\pub.dev'),
              os.path.expandvars(r'%PUB_CACHE%\hosted\pub.dev')
          ]

          for base in cache_dirs:
              if not os.path.exists(base):
                  continue
              for f in glob.glob(os.path.join(base, 'appflowy_editor-*', 'lib', 'src', 'plugins', 'markdown', 'decoder', 'delta_markdown_decoder.dart')):
                  c = open(f).read().replace('with md.NodeVisitor', 'implements md.NodeVisitor')
                  open(f, 'w').write(c)

              for f in glob.glob(os.path.join(base, 'appflowy_editor-*', 'lib', 'src', 'editor', 'editor_component', 'service', 'ime', 'delta_input_service.dart')):
                  c = open(f).read()
                  if 'onFocusReceived' not in c:
                      c = c.replace('class DeltaTextInputService extends TextInputService with DeltaTextInputClient {', 'class DeltaTextInputService extends TextInputService with DeltaTextInputClient {\n  @override\n  bool onFocusReceived() => false;\n')
                      open(f, 'w').write(c)

      - name: Build Windows
        working-directory: ./client
        run: flutter build windows --release

      - name: Zip Windows Build
        run: Compress-Archive -Path client\build\windows\x64\runner\Release\* -DestinationPath lifeos-windows-release.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-windows-zip
          path: lifeos-windows-release.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    if: always() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-artifacts

      - name: Download Windows Artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: lifeos-windows-zip
          path: release-artifacts

      - name: Generate Release Body
        run: |
          BUILD_NUM=$(jq '.build_number' .agent/version.json)
          cat <<EOF > release_notes.md
          ## Release Build #$BUILD_NUM — LifeOS Supercharged Search & Offline Vault

          ### Highlights & What's New
          - **Universal Spotlight Search & Command Palette (Ctrl+K)**:
            - Instant keyboard navigation to all LifeOS modules/tabs (Prayers, Music, Notes, Gallery, Movies, Finance, Maps, Tasks, Settings).
            - Direct launcher for all Orthodox liturgical services, David's Psalter, New/Old Testament Scriptures, and Synaxarion.
            - Filter chips by category and rich Everforest badges.
          - **Complete Orthodox Hymnography & Canons**:
            - Full Canons across all 8 Tones (St. John of Damascus).
            - Small & Great Paraklesis to the Theotokos, Great Compline, and Holy Communion Canon.
            - Canonical Hours (1st, 3rd, 6th, 9th) and Midnight Office (Amomos Ps. 118, Bridegroom Troparia).
            - Strictly authentic Greek liturgical texts with zero English interpolations.
          - **Audiophile Studio & Offline Music Vault**:
            - Save music from server vault to device for 100% offline playback.
            - 10-band EQ, bass/treble boost, 3D spatial audio, and preamp gain.
          - **OTA Background Updates**:
            - Automatic background update checks and one-tap install for Android APK & Windows.
          EOF

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            release-artifacts/app-release.apk
            release-artifacts/lifeos-windows-release.zip
          fail_on_unmatched_files: false

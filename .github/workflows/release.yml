name: Release LifeOS Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client/android/**/*.gradle*', 'client/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('client/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Strip Local JVM Paths
        working-directory: ./client
        run: sed -i '/org.gradle.java/d' android/gradle.properties

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Patch Dependencies Compatibility
        working-directory: ./client
        run: python3 tool/patch_appflowy.py

      - name: Build APK
        working-directory: ./client
        run: flutter build apk --release --no-pub

      - name: Generate Release Body
        run: |
          VERSION=$(jq -r '.version // "1.5.12"' .agent/version.json)
          BUILD_NUM=$(jq -r '.build_number // 50' .agent/version.json)
          cat <<EOF > release_notes.md
          ## LifeOS v$VERSION (Build #$BUILD_NUM) — 100% Complete Offline Scripture, Psalter, Synaxarion & Calendar

          ### Highlights & What's New
          - **100% Offline Psalter (Ψαλτήριον)**:
            - Embedded all 150 Psalms across all 20 Kathismata into the app bundle (`assets/prayers/psalter.json`).
            - Complete ancient Greek text with Panagiotis Trembelas modern Greek interpretation available offline.
          - **100% Offline New Testament (Καινή Διαθήκη)**:
            - Embedded all 27 New Testament books, all chapters and verses into the app bundle (`assets/prayers/nt.json`).
            - Complete ancient Greek text and modern Greek translation with chapter navigation bar.
          - **100% Offline Synaxarion (Ορθόδοξος Συναξαριστής)**:
            - Embedded all 365 calendar days with complete lives of Saints, Feasts, Apolytikia, and Kontakia (`assets/prayers/synaxarion.json`).
          - **100% Offline Liturgical Calendar & Lectionary (Ημερολόγιο & Αναγνώσματα)**:
            - Full year daily Apostle and Gospel readings embedded into the app bundle (`assets/prayers/lectionary.json`).
          - **Resilient OTA Updates**:
            - Background download fallback with automatic switch from daemon proxy to direct GitHub CDN.
            - Explicit "Download & Install" button and 1-tap "Download via Browser" link in Settings.
          EOF

      - name: Publish Android APK Immediately
        uses: softprops/action-gh-release@v2
        with:
          name: LifeOS ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: client/build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Enable Developer Mode & Symlinks
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -ErrorAction SilentlyContinue
          git config --system core.symlinks true
          git config --system core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('client/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Patch Dependencies Compatibility
        shell: powershell
        working-directory: ./client
        run: python tool/patch_appflowy.py

      - name: Build Windows
        working-directory: ./client
        run: flutter build windows --release --no-pub

      - name: Zip Windows Build
        run: Compress-Archive -Path client\build\windows\x64\runner\Release\* -DestinationPath lifeos-windows-release.zip

      - name: Attach Windows ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          name: LifeOS ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: lifeos-windows-release.zip
          fail_on_unmatched_files: true

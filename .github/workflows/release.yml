name: Release LifeOS Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'

      - name: Strip Local JVM Paths
        working-directory: ./client
        run: sed -i '/org.gradle.java/d' android/gradle.properties

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Patch Dependencies Compatibility
        working-directory: ./client
        run: python3 tool/patch_appflowy.py

      - name: Build APK
        working-directory: ./client
        run: flutter build apk --release --no-pub

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Enable Developer Mode & Symlinks
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -ErrorAction SilentlyContinue
          git config --system core.symlinks true
          git config --system core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Patch Dependencies Compatibility
        shell: powershell
        working-directory: ./client
        run: python tool/patch_appflowy.py

      - name: Build Windows
        working-directory: ./client
        run: flutter build windows --release --no-pub

      - name: Zip Windows Build
        run: Compress-Archive -Path client\build\windows\x64\runner\Release\* -DestinationPath lifeos-windows-release.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-windows-zip
          path: lifeos-windows-release.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    if: always() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-artifacts

      - name: Download Windows Artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: lifeos-windows-zip
          path: release-artifacts

      - name: Generate Release Body
        run: |
          VERSION=$(jq -r '.version // "1.5.7"' .agent/version.json)
          BUILD_NUM=$(jq -r '.build_number // 45' .agent/version.json)
          cat <<EOF > release_notes.md
          ## LifeOS v$VERSION (Build #$BUILD_NUM) — Dynamic Version Detection & Silent Latest State

          ### Highlights & What's New
          - **Dynamic Version Detection & Zero Redundant Pop-ups**:
            - App now queries OS-level package metadata via `PackageInfo` to accurately detect current version and build number.
            - When running the latest version, update pop-ups and banners are strictly suppressed.
            - Automatically purges obsolete update caches when app is up-to-date.
          - **Permanent Release Keystore (Zero Signature Mismatch)**:
            - Configured dedicated permanent release signing keystore with APK Signature Schemes v1, v2, v3, and v4 enabled.
            - In-place 1-tap OTA upgrades without uninstalling.
          - **Robust APK Installation & Parse Error Prevention**:
            - External cache storage for APK updates on Android to prevent SELinux sandboxing issues on Huawei / EMUI / HarmonyOS.
            - Atomic `.part` file downloading with strict size and completion validation to prevent corrupted partial APK files.
          - **Smooth TOC & Sidebar Navigation**:
            - Zero indicator flickering / bouncing when selecting sections in Table of Contents or desktop sidebar.
          - **Full Unabbreviated Liturgical Texts (Zero Cuts / No Truncation)**:
            - Complete unabbreviated Psalm 103 (35 verses), Kekragaria Stichologia (18 verses), Stichera on 10, Six Psalms of Matins, Doxastika, and Apolytikia.
          - **Commemorated Saint Selector**:
            - Dropdown selector with arrow icon to dynamically switch between all commemorated saints of the day.
          EOF

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: LifeOS ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release-artifacts/app-release.apk
            release-artifacts/lifeos-windows-release.zip
          fail_on_unmatched_files: false

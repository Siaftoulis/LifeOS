name: Release LifeOS Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'
          cache: true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client/android/**/*.gradle*', 'client/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('client/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Strip Local JVM Paths
        working-directory: ./client
        run: sed -i '/org.gradle.java/d' android/gradle.properties

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Patch Dependencies Compatibility
        working-directory: ./client
        run: python3 tool/patch_appflowy.py

      - name: Build APK
        working-directory: ./client
        run: flutter build apk --release --no-pub

      - name: Generate Release Body
        run: |
          VERSION=$(jq -r '.version // "1.5.10"' .agent/version.json)
          BUILD_NUM=$(jq -r '.build_number // 48' .agent/version.json)
          cat <<EOF > release_notes.md
          ## LifeOS v$VERSION (Build #$BUILD_NUM) — Settings OTA Updates & Spatial Grid Directory

          ### Highlights & What's New
          - **System & OTA Updates in Settings**:
            - Added direct access to **System Updates & OTA** inside the main Settings (GridConfigurator).
            - Check for new versions, view release changelog, and trigger 1-tap seamless APK updates directly from Settings.
          - **Full Spatial Matrix Grid Integration**:
            - Added all 20+ installed ecosystem hubs and modules to the Spatial Matrix Editor and FeatureRegistry.
            - Assign any module to any grid slot: Prayer Book, Books (EPUB), Flashcards, Obsidian Zen, Chat Hub, Smart Home, Maps & Live Tracking, Finance, RPG, Media Hub, Nexus, and more.
            - Added **All Installed Modules Directory** in Settings to browse and launch all ecosystem modules directly.
          - **Mobile Reader UI & Scripture Overhaul**:
            - Eliminated scroll traps and gesture conflicts in the Gospel, Apostle, and Psalter.
            - Fluid chapter navigation bar and clean sacred typography.
          EOF

      - name: Publish Android APK Immediately
        uses: softprops/action-gh-release@v2
        with:
          name: LifeOS ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: client/build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Enable Developer Mode & Symlinks
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -ErrorAction SilentlyContinue
          git config --system core.symlinks true
          git config --system core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('client/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Patch Dependencies Compatibility
        shell: powershell
        working-directory: ./client
        run: python tool/patch_appflowy.py

      - name: Build Windows
        working-directory: ./client
        run: flutter build windows --release --no-pub

      - name: Zip Windows Build
        run: Compress-Archive -Path client\build\windows\x64\runner\Release\* -DestinationPath lifeos-windows-release.zip

      - name: Attach Windows ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          name: LifeOS ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: lifeos-windows-release.zip
          fail_on_unmatched_files: true

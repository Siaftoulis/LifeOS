name: Release LifeOS Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'

      - name: Strip Local JVM Paths
        working-directory: ./client
        run: sed -i '/org.gradle.java/d' android/gradle.properties

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Patch Dependencies Compatibility
        working-directory: ./client
        run: python3 tool/patch_appflowy.py

      - name: Build APK
        working-directory: ./client
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Enable Developer Mode & Symlinks
        shell: powershell
        run: |
          Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -ErrorAction SilentlyContinue
          git config --system core.symlinks true
          git config --system core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Patch Dependencies Compatibility
        working-directory: ./client
        run: python tool/patch_appflowy.py

      - name: Build Windows
        working-directory: ./client
        run: flutter build windows --release

      - name: Zip Windows Build
        run: Compress-Archive -Path client\build\windows\x64\runner\Release\* -DestinationPath lifeos-windows-release.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-windows-zip
          path: lifeos-windows-release.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    if: always() && (needs.build-android.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifact
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-artifacts

      - name: Download Windows Artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: lifeos-windows-zip
          path: release-artifacts

      - name: Generate Release Body
        run: |
          VERSION=$(jq -r '.version // "1.5.0"' .agent/version.json)
          BUILD_NUM=$(jq -r '.build_number // 37' .agent/version.json)
          cat <<EOF > release_notes.md
          ## LifeOS v$VERSION (Build #$BUILD_NUM) — Universal Search & Offline Vault

          ### Highlights & What's New
          - **Universal Spotlight Search & Command Palette (Ctrl+K)**:
            - Instant keyboard navigation to all LifeOS modules/tabs (Prayers, Music, Notes, Gallery, Movies, Finance, Maps, Tasks, Settings).
            - Direct launcher for all Orthodox liturgical services, David's Psalter, New/Old Testament Scriptures, and Synaxarion.
            - Filter chips by category and rich Everforest badges.
          - **Complete Orthodox Hymnography & Canons**:
            - Full Canons across all 8 Tones (St. John of Damascus).
            - Small & Great Paraklesis to the Theotokos, Great Compline, and Holy Communion Canon.
            - Canonical Hours (1st, 3rd, 6th, 9th) and Midnight Office (Amomos Ps. 118, Bridegroom Troparia).
            - Strictly authentic Greek liturgical texts with zero English interpolations.
          - **Audiophile Studio & Offline Music Vault**:
            - Save music from server vault to device for 100% offline playback.
            - 10-band EQ, bass/treble boost, 3D spatial audio, and preamp gain.
          - **OTA Background Updates**:
            - Automatic background update checks and one-tap install for Android APK & Windows.
          EOF

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: LifeOS ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release-artifacts/app-release.apk
            release-artifacts/lifeos-windows-release.zip
          fail_on_unmatched_files: false

name: lifeos_client
description: A new Flutter project.
publish_to: 'none'
version: 1.5.0+38

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.0
  window_manager: ^0.5.2
  desktop_multi_window: ^0.3.0
  drift: any
  web_socket_channel: ^3.0.3
  path_provider: ^2.1.5
  http: ^1.2.0
  url_launcher: ^6.3.2
  installed_apps: ^2.1.1
  geolocator: any

  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  flutter_displaymode: ^0.7.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.4
  permission_handler: ^12.0.3
  nsd: ^5.0.1
  photo_manager: 3.9.0
  photo_manager_image_provider: ^2.2.0
  extended_image: ^10.0.1
  image_cropper: ^12.2.1
  share_plus: any

  video_player: ^2.11.1
  flutter_map_marker_cluster: ^8.2.2
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.7

  archive: any
  path: any
  intl: any
  flutter_markdown_plus: ^1.0.12
  markdown_editor_live: ^0.6.0
  appflowy_editor: ^1.4.0
  file_picker: any
  just_audio: ^0.10.6
  on_audio_query: ^2.9.0
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  media_kit: ^1.2.6
  ffi: ^2.1.2
  shared_preferences: ^2.5.5

  # Audio analysis for waveforms and metadata
  fft: ^0.4.0
  audio_waveforms: ^1.0.4

dependency_overrides:
  intl: 0.20.2
  markdown: 7.2.2
  file_picker: 8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: any
  drift_dev: any
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "assets/logo_background.png"
  adaptive_icon_foreground: "assets/logo_foreground.png"
  adaptive_icon_monochrome: "assets/logo_monochromatic.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo.png"
  linux:
    generate: true
    image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/version.json
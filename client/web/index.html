<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="LifeOS - Spatial Living Operating System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LifeOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LifeOS</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #1e2326;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #lifeos-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #272e33 0%, #1e2326 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash-logo-container {
      position: relative;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .splash-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      background: #a7c080;
      opacity: 0.25;
      filter: blur(16px);
      animation: pulse-glow 2.4s ease-in-out infinite alternate;
    }

    .splash-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #2e383c;
      border: 1px solid rgba(167, 192, 128, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.36);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .splash-icon img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    .splash-title {
      color: #d3c6aa;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.2px;
      margin-bottom: 6px;
    }

    .splash-subtitle {
      color: #859289;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.8px;
      margin-bottom: 28px;
    }

    .splash-bar-wrapper {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .splash-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #a7c080, #dbbc7f);
      border-radius: 4px;
      animation: progress-slide 1.4s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0% { transform: scale(0.9); opacity: 0.18; }
      100% { transform: scale(1.15); opacity: 0.38; }
    }

    @keyframes progress-slide {
      0% { left: -50%; width: 30%; }
      50% { width: 60%; }
      100% { left: 100%; width: 30%; }
    }
  </style>

  <script>
    // Deregister any stale service workers in the background without reloading or wiping caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      }).catch(function(e) {});
    }

    // Dismiss splash screen smoothly when Flutter renders
    function dismissLifeOSSplash() {
      var splash = document.getElementById('lifeos-splash');
      if (splash && splash.style.opacity !== '0') {
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 450);
      }
    }

    window.addEventListener('flutter-first-frame', dismissLifeOSSplash);

    // Observer fallback: dismiss when Flutter DOM element mounts
    var observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
        dismissLifeOSSplash();
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</head>
<body>
  <!-- Instant Everforest Branded Splash Screen -->
  <div id="lifeos-splash">
    <div class="splash-logo-container">
      <div class="splash-glow"></div>
      <div class="splash-icon">
        <img src="favicon.png" alt="LifeOS Logo" />
      </div>
    </div>
    <div class="splash-title">LifeOS</div>
    <div class="splash-subtitle">Spatial Living Operating System</div>
    <div class="splash-bar-wrapper">
      <div class="splash-bar"></div>
    </div>
  </div>

  <script>
    // Inject flutter_bootstrap.js
    var script = document.createElement('script');
    script.src = "flutter_bootstrap.js";
    document.body.appendChild(script);
  </script>
</body>
</html>
